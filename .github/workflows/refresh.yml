name: Refresh board data

on:
  schedule:
    - cron: "*/5 * * * *"   # starts a new loop every ~5 min (GitHub may delay; each loop covers ~9 min)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false   # one loop runs, one waits; no gaps, no pile-up

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Queue the next loop now (self-chaining; scheduler is unreliable under load)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-05T15:00:00Z' +%s)" ]; then
            gh workflow run refresh.yml --ref main -R ${{ github.repository }} || echo "chain dispatch failed"
          fi
      - name: Refresh every ~60 s for ~9 minutes
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          ( while true; do timeout 300 python fetch_results.py || true; sleep 15; done ) &
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 540 ]; do
            t0=$(date +%s)
            python fetch_data.py || echo "fetch failed; keeping last data"
            git add data.json
            if ! git diff --cached --quiet; then
              git commit -q -m "data: $(date -u +%FT%TZ)"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 3; done
            fi
            el=$(( $(date +%s) - t0 ))
            [ $el -lt 60 ] && sleep $(( 60 - el ))
          done
